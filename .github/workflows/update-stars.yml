name: Update stars reports

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check scripts
        run: npm run check

      - name: Update reports
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit report changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update stars reports"
          file_pattern: "data/stars-skills-mcp.json reports/*.md reports/*.csv"
